version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: gradematcher-mongodb
    environment:
      MONGO_INITDB_DATABASE: gradematcher
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - gradematcher-network

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: gradematcher-backend
    depends_on:
      - mongodb
    environment:
      MONGODB_URI: mongodb://mongodb:27017/gradematcher
      PORT: 5000
      JWT_SECRET: sua_chave_secreta_aqui
      NODE_ENV: development
    ports:
      - "5000:5000"
    volumes:
      - ./server:/app
      - /app/node_modules
    networks:
      - gradematcher-network

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: gradematcher-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./client:/app
      - /app/node_modules
    networks:
      - gradematcher-network

volumes:
  mongodb-data:

networks:
  gradematcher-network:
    driver: bridge
